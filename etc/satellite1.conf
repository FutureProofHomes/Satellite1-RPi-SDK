# /etc/satellite1.conf
# Satellite1 system configuration
# Lines beginning with "#" are comments.

#######################################
# Line-out DAC (LineOutDACConfig)
#######################################

[line_out]
# Enable the line-out DAC on startup
enabled = true

# Initial output volume in the range [0.0, 1.0]
startup_volume = 0.5

# Start muted?
startup_muted = false
restore_on_startup = true

[speaker]
enabled = true
startup_volume = 0.7
startup_muted = true
restore_on_startup = true



#######################################
# XMOS (optional; for future use)
# If your loader ignores unknown fields/sections,
# you can keep this here as documentation.
#######################################
[xmos]


#######################################
# HAT buttons (sat1-buttons daemon)
# Map each physical button to a Linux input key code (see
# linux/input-event-codes.h, e.g. KEY_VOLUMEUP, KEY_PLAYPAUSE, KEY_HOMEPAGE).
# Set a button to "" to disable it. The mic-mute button is owned by the XMOS
# in hardware and is not listed here.
#######################################
[buttons]
volume_up = "KEY_VOLUMEUP"
volume_down = "KEY_VOLUMEDOWN"
# The manufacturer's "action" button. Defaulted to KEY_MUTE so it toggles the
# speaker mute; change it to repurpose the button (e.g. "KEY_PLAYPAUSE").
action = "KEY_MUTE"

#######################################
# Logging (optional; app/CLI may or may not use)
#######################################
[logging]
# level can be: "DEBUG", "INFO", "WARNING", "ERROR"
level = "INFO"
