# /etc/satellite1.conf
# Satellite1 system configuration
# Lines beginning with "#" are comments.

#######################################
# Line-out DAC (LineOutDACConfig)
#######################################

[line_out]
# Enable the line-out DAC on startup
enabled = true

# Fallback output volume in the range [0.0, 1.0]. Used on first boot or when
# volume restoration is disabled or no valid saved volume is available.
startup_volume = 0.5

# Apply this mute state after setting the restored or fallback volume.
startup_muted = false
# Restore the last successfully set volume from /var/lib/satellite1/audio-state.json.
restore_volume_on_startup = true

[speaker]
enabled = true
startup_volume = 1.0
startup_muted = false
restore_volume_on_startup = true

[gpio]
# Linux GPIO controller for BCM 5 (XMOS reset) and BCM 7 (action button).
chip = "/dev/gpiochip0"

[led_ring]
# Render the 24-pixel LED ring through XMOS device control.
enabled = false
backend = "xmos"
# Default RGB color for LED animations without an explicit color.
# system_color = [0, 90, 255]

[lva]
# LVA automatically registers the LED Ring light when enabled. Home Assistant
# controls its solid background with on/off, RGB, and brightness.
# enabled = true
# url = "ws://127.0.0.1:6055"
# Must match LVA's timer_max_ring_seconds setting.
# timer_max_ring_seconds = 900.0

[mqtt]
# Publish environmental sensors, power delivery, and XMOS firmware as Home
# Assistant MQTT Discovery entities.
# enabled = true
# host = "mqtt.example.net"
# port = 1883
# Omit username and password_file for anonymous brokers.
# username = "satellite1"
# password_file = "/etc/satellite1/mqtt-password"
# Topic and entity identity default to "satellite1" and this machine's hostname.
# topic_prefix = "satellite1"
# device_id = "kitchen-satellite"
# publish_interval = 60.0
# TLS uses the system certificate store; set port appropriately (usually 8883).
# tls = false


#######################################
# XMOS (optional; for future use)
# If your loader ignores unknown fields/sections,
# you can keep this here as documentation.
#######################################
[xmos]


#######################################
# Optional Linux input events for HAT buttons
#######################################
[buttons]
# Read the action button directly from BCM 7. Set to "xmos" to use SPI/XMOS.
action_source = "gpio"

[buttons.evdev]
# volume_up = "KEY_VOLUMEUP"
# volume_down = "KEY_VOLUMEDOWN"
# action = "KEY_MUTE"
# mic_mute = "KEY_MICMUTE"

[workflows.volume-buttons]
# enabled = true
# step = 0.05
# led_enabled = true
# led_color = [0, 90, 255] # Omit to use led_ring.system_color.
# led_muted_color = [255, 0, 0]
# led_timeout = 1.5

[workflows.jack-led]
# enabled = true
# color = [0, 90, 255] # Omit to use led_ring.system_color.
# frame_interval = 0.04

[workflows.mute-led]
# Keep these colored pixels above all normal frames and temporary animations.
# enabled = true
# mic_muted_color = [255, 0, 0]
# speaker_muted_color = [200, 0, 0]


#######################################
# Logging (optional; app/CLI may or may not use)
#######################################
[logging]
# level can be: "DEBUG", "INFO", "WARNING", "ERROR"
level = "INFO"
