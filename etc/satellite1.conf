# /etc/satellite1.conf
# Satellite1 daemon configuration. Lines beginning with "#" are comments.
# Restart satellite1d after changing this file.

#######################################
# Audio Outputs
# Both output devices are initialized at startup. Line-out is selected when a
# jack is present; otherwise audio is routed to the speaker.
#######################################

[line_out]
# PCM5122 line-out DAC startup behavior.
# Fallback output volume in the range [0.0, 1.0]. Used on first boot or when
# volume restoration is disabled or no valid saved volume is available.
startup_volume = 0.5
# Apply this mute state after setting the restored or fallback volume.
startup_muted = false
# Restore the last successfully set volume from /var/lib/satellite1/audio-state.json.
restore_volume_on_startup = true

[speaker]
# TAS2780 speaker amplifier startup behavior.
# Speaker channel: "left", "right", or the default stereo down-mix "dwn_mix".
channel = "dwn_mix"
# Amplifier gain from 0 to 20.
amp_level = 8
startup_volume = 1.0
startup_muted = false
restore_volume_on_startup = true

#######################################
# Hardware
# Configure the physical interfaces fitted to the Satellite1 HAT.
#######################################

[gpio]
# Linux GPIO controller for BCM 5 (XMOS reset) and BCM 7 (action button).
chip = "/dev/gpiochip0"

[buttons]
# Physical action-button source. "gpio" reads BCM 7 directly; "xmos" reads
# the button through SPI/XMOS.
action_source = "gpio"

[buttons.evdev]
# Optional Linux input-device mappings for HAT button presses. Uncomment one
# or more entries to enable them; values are Linux KEY_* names.
# volume_up = "KEY_VOLUMEUP"
# volume_down = "KEY_VOLUMEDOWN"
# action = "KEY_MUTE"
# mic_mute = "KEY_MICMUTE"

[led_ring]
# 24-pixel LED ring.
enabled = true
# Rendering backend. Keep this set to "xmos" for the Satellite1 HAT.
backend = "xmos"
# RGB color used by LED workflows that do not configure their own color.
# Set it here, or leave it commented out to set it through the CLI, LVA, or MQTT.
# system_color = [0, 90, 255]

#######################################
# Workflows
# Optional policies that combine daemon events with actions.
#######################################

[workflows.volume-buttons]
# Change the active output volume from HAT volume-button presses.
enabled = true
# step = 0.05

[workflows.volume]
# Show LED feedback for every output-volume change, regardless of its source.
enabled = true
# color = [0, 90, 255] # Omit to use led_ring.system_color.
# timeout = 1.5

[workflows.jack-led]
# Animate line-out jack insertion and removal.
enabled = true
# color = [0, 90, 255] # Omit to use led_ring.system_color.
# frame_interval = 0.04

[workflows.mute-led]
# Display microphone and speaker mute states above normal LED frames.
enabled = true
# Indicator colors. Omit either setting to use led_ring.system_color.
mic_muted_color = [255, 0, 0]
speaker_muted_color = [255, 0, 0]

#######################################
# Integrations
# Optional connections to local services and home automation.
#######################################

[lva]
# ESPHome LVA peripheral API for audio, mute, timer, and voice-pipeline events.
# enabled = true
# url = "ws://127.0.0.1:6055"
# Reconnect delay in seconds after a peripheral API connection failure.
# reconnect_delay = 3.0
# Must match LVA's timer_max_ring_seconds setting.
# timer_max_ring_seconds = 900.0

[mqtt]
# Publish environmental sensors, power delivery, and XMOS firmware as Home
# Assistant MQTT Discovery entities.
# enabled = true
# host = "mqtt.example.net"
# port = 1883
# Omit username and password_file for anonymous brokers.
# username = "satellite1"
# password_file = "/etc/satellite1/mqtt-password"
# Topic and entity identity default to "satellite1" and this machine's hostname.
# topic_prefix = "satellite1"
# device_id = "kitchen-satellite"
# publish_interval = 60.0
# reconnect_delay = 3.0
# TLS uses the system certificate store; set port appropriately (usually 8883).
# tls = false

#######################################
# Logging
# Daemon logs are written to the systemd journal. Use `satellite1d -v` to
# enable at least INFO logging for an interactive invocation, or `-vv` for DEBUG.
#######################################

[logging]
# Valid values: "DEBUG", "INFO", "WARNING", "ERROR".
level = "INFO"
