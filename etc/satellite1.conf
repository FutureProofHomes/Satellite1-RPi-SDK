# /etc/satellite1.conf
# Satellite1 system configuration
# Lines beginning with "#" are comments.

#######################################
# Line-out DAC (LineOutDACConfig)
#######################################

[line_out]
# Enable the line-out DAC on startup
enabled = true

# Initial output volume in the range [0.0, 1.0]
startup_volume = 0.5

# Start muted?
startup_muted = false
restore_on_startup = true

[speaker]
enabled = true
startup_volume = 1.0
startup_muted = true
restore_on_startup = true

[gpio]
# Linux GPIO controller for BCM 5 (XMOS reset) and BCM 7 (action button).
chip = "/dev/gpiochip0"

[led_ring]
# Render the 24-pixel LED ring through XMOS device control.
enabled = false
backend = "xmos"


#######################################
# XMOS (optional; for future use)
# If your loader ignores unknown fields/sections,
# you can keep this here as documentation.
#######################################
[xmos]


#######################################
# Optional Linux input events for HAT buttons
#######################################
[buttons]
# Read the action button directly from BCM 7. Set to "xmos" to use SPI/XMOS.
action_source = "gpio"

[buttons.evdev]
# volume_up = "KEY_VOLUMEUP"
# volume_down = "KEY_VOLUMEDOWN"
# action = "KEY_MUTE"
# mic_mute = "KEY_MICMUTE"


#######################################
# Logging (optional; app/CLI may or may not use)
#######################################
[logging]
# level can be: "DEBUG", "INFO", "WARNING", "ERROR"
level = "INFO"
