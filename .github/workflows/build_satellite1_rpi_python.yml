name: Build local SDK packages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Restore package cache
        uses: actions/cache@v5
        with:
          path: apt-cache/
          key: ${{ runner.os }}-${{ github.job }}-${{ inputs.image-name }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}
            ${{ runner.os }}

      - name: Set up APT proxy on runner
        run: |
          mkdir -p apt-cache
          sudo apt-get install -y apt-cacher-ng --no-install-suggests --no-install-recommends
          sudo bash -c 'echo "Port: 9999" >> /etc/apt-cacher-ng/acng.conf'
          sudo mv -f apt-cache/* /var/cache/apt-cacher-ng/ || true
          sudo chown -R apt-cacher-ng:apt-cacher-ng /var/cache/apt-cacher-ng
          sudo service apt-cacher-ng restart

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build deb-builder Docker image
        working-directory: ./
        run: |
          make docker-image

      - name: Build local SDK packages
        run: |
          make clean
          make deb BUILD_KIND=local

      - name: Identify package artifacts
        id: package-artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(out/local/*.deb)
          wheels=(out/local/satellite1_rpi-*.whl)
          test "${#debs[@]}" -eq 1
          test "${#wheels[@]}" -eq 1
          echo "name=$(basename "${debs[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package-artifacts.outputs.name }}
          path: |
            out/local/*.deb
            out/local/satellite1_rpi-*.whl
          if-no-files-found: error

      - name: Save package cache
        if: always()
        run: |
          mkdir -p apt-cache
          if [ -d "/var/cache/apt-cacher-ng" ]; then
            sudo rm -rf apt-cache/*
            sudo mv -f /var/cache/apt-cacher-ng/* apt-cache/ || true
          fi
