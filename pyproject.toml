[build-system]
requires = ["setuptools==84.0.0", "setuptools-scm[simple]==9.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite1-rpi"
description = "Control library for the Satellite1 Raspberry Pi HAT"
readme = "README.md"
authors = [{ name = "Mischa Siekmann", email = "mischa.siekmann@futureproofhomes.net" }]
license = { file = "LICENSE" }
dynamic = ["version"]

dependencies = [
    "smbus2>=0.4",
    "spidev>=3.8 ; sys_platform == 'linux'",
    "RPi.GPIO>=0.7 ; sys_platform == 'linux' and (platform_machine == 'armv7l' or platform_machine == 'aarch64')",
]

requires-python = ">=3.11"

[project.optional-dependencies]
daemon = [
    "pydantic>=2.13,<3",
    "rpi_ws281x>=5.0 ; sys_platform == 'linux' and (platform_machine == 'armv7l' or platform_machine == 'aarch64')",
]
dev = ["pydantic>=2.13,<3", "pytest", "black"]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["satellite1", "satellite1.*", "satellite1_cli", "satellite1_cli.*", "satellite1_hw", "satellite1_hw.*", "satellite1d", "satellite1d.*"]

[project.scripts]
sat1 = "satellite1_cli.cli_sat1:main"
sat1-dac = "satellite1_cli.cli_dac:main"
sat1-speaker = "satellite1_cli.cli_dac:speaker"
sat1-lineout = "satellite1_cli.cli_dac:lineout"
sat1-xmos = "satellite1_cli.cli_xmos:xmos_main"
satellite1d = "satellite1d.main:main"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
